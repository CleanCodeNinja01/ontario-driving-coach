services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: driving_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driving_coach"]
      interval: 5s
      retries: 10
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
volumes:
  pgdata:
  ollama: